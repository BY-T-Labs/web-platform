<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BY-T Labs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0f;
    color: #e4e4e7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .bg-glow {
    position: fixed;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(99,102,241,0.25), transparent 70%);
    top: -200px;
    left: -200px;
    filter: blur(60px);
  }
  .bg-glow.two {
    top: auto;
    left: auto;
    bottom: -200px;
    right: -200px;
    background: radial-gradient(circle, rgba(6,182,212,0.2), transparent 70%);
  }
  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px;
  }
  .badge {
    display: inline-block;
    padding: 6px 16px;
    border: 1px solid rgba(99,102,241,0.4);
    border-radius: 999px;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #a5b4fc;
    margin-bottom: 24px;
  }
  h1 {
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 700;
    background: linear-gradient(135deg, #fff 30%, #818cf8 70%, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.03em;
    margin-bottom: 16px;
  }
  p {
    font-size: 1.1rem;
    color: #94a3b8;
    max-width: 520px;
    margin: 0 auto 32px;
    line-height: 1.6;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    font-size: 0.9rem;
    color: #d1d5db;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 8px #22c55e;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-glow two"></div>
  <div class="container">
    <span class="badge">BY-T Labs</span>
    <h1>Novidades a caminho</h1>
    <p>Estamos preparando algo novo. Em breve você vai ver o que estivemos construindo nos bastidores.</p>
    <div class="status">
      <span class="dot"></span>
      Em construção
    </div>
  </div>
</body>
</html>
